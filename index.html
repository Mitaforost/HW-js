<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    input {
      width: 100px;
      margin: 5px;
    }
    button {
      margin: 5px;
      padding: 5px 10px;
    }
    #result {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Калькулятор</h2>
  
  <input type="number" id="num1" placeholder="Число 1">
  <input type="number" id="num2" placeholder="Число 2">
  <br>

  <button onclick="calculate('add')">Сложение</button>
  <button onclick="calculate('subtract')">Вычитание</button>
  <button onclick="calculate('multiply')">Умножение</button>
  <button onclick="calculate('divide')">Деление</button>

  <div id="result">Результат: </div>

  <script src="app.js"></script>

</body>
</html>
